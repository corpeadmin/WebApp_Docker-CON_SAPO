services:
  api:
    build: ./api
    ports:
      - "5000:8080"
    environment:
      Message: ${APP_MESSAGE}

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: appdb
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
